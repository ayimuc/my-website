<!DOCTYPE html>
<html lang="zh">
<head>

  <title>aYi Chinese Kitchen</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 100px auto;
      padding: 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: #555;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>你好 👋</h1>

    <p>
      欢迎来到我的个人网站。
    </p>

    <p>
      我正在学习如何搭建自己的网站。
    </p>

    <p>
      联系我：
      <a href="mailto:your@email.com">
        your@email.com
      </a>
    </p>
  </div>

</body>
</html>
